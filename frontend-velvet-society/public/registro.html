<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Velvet Society</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">Velvet <span>Society</span></a>
        <ul class="navbar-nav">
            <li><a href="/">Inicio</a></li>
            <li><a href="/login.html">Iniciar Sesión</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 400px; margin-top: 4rem;">
        <div class="card">
            <h2 class="text-center">Crear Cuenta</h2>
            <p class="text-center">Únete a Velvet Society</p>

            <div id="alerta" class="alert hidden"></div>

            <form id="registroForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono (Opcional)</label>
                    <input type="tel" id="telefono" class="form-control" placeholder="+52 123 456 7890">
                </div>
                <div class="form-group">
                    <label for="direccion">Dirección (Opcional)</label>
                    <input type="text" id="direccion" class="form-control" placeholder="Tu dirección">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
            </form>

            <p class="text-center mt-2">¿Ya tienes cuenta? <a href="/login.html" style="color: var(--dorado);">Inicia Sesión</a></p>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Velvet Society</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">Velvet <span>Society</span></a>
        <ul class="navbar-nav">
            <li><a href="/">Inicio</a></li>
            <li><a href="/servicios.html">Servicios</a></li>
            <li><a href="/reservas.html">Reservas</a></li>
            <li><a href="/perfil.html">Perfil</a></li>
            <li><a href="/login.html">Iniciar Sesión</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="text-center">Mis Reservas</h1>
        <p class="text-center">Gestiona y consulta tus reservas</p>

        <div id="alerta" class="alert hidden"></div>

        <!-- Formulario de nueva reserva -->
        <div class="card">
            <h3>Nueva Reserva</h3>
            <form id="reservaForm">
                <div class="form-group">
                    <label for="servicio">Servicio</label>
                    <select id="servicio" class="form-control" required>
                        <option value="">Selecciona un servicio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="observaciones">Observaciones (Opcional)</label>
                    <input type="text" id="observaciones" class="form-control" placeholder="Alguna indicación especial">
                </div>
                <button type="submit" class="btn btn-primary">Realizar Reserva</button>
            </form>
        </div>

        <!-- Lista de reservas -->
        <div class="card">
            <h3>Historial de Reservas</h3>
            <div id="reservasContainer">
                <p>Cargando reservas...</p>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/reservas.js"></script>
</body>
</html>

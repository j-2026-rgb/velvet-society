<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - Velvet Society</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">Velvet <span>Society</span></a>
        <ul class="navbar-nav">
            <li><a href="/admin.html">Panel Admin</a></li>
            <li><a href="/">Ver Sitio</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1 class="text-center">Panel Administrativo</h1>
        <p class="text-center">Gestión integral de Velvet Society</p>

        <div id="alerta" class="alert hidden"></div>

        <!-- Gestión de Servicios -->
        <div class="card">
            <h2>Gestión de Servicios</h2>
            <form id="servicioForm" class="mb-3">
                <div class="form-group">
                    <label for="nombreServicio">Nombre del Servicio</label>
                    <input type="text" id="nombreServicio" class="form-control" placeholder="Nombre del servicio" required>
                </div>
                <div class="form-group">
                    <label for="descripcionServicio">Descripción</label>
                    <input type="text" id="descripcionServicio" class="form-control" placeholder="Descripción del servicio">
                </div>
                <div class="form-group">
                    <label for="precioServicio">Precio</label>
                    <input type="number" id="precioServicio" class="form-control" placeholder="0.00" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary">Crear Servicio</button>
            </form>

            <h3>Servicios Existentes</h3>
            <div id="serviciosContainer">
                <p>Cargando servicios...</p>
            </div>
        </div>

        <!-- Gestión de Clientes -->
        <div class="card">
            <h2>Gestión de Clientes</h2>
            <div id="clientesContainer">
                <p>Cargando clientes...</p>
            </div>
        </div>

        <!-- Gestión de Reservas -->
        <div class="card">
            <h2>Gestión de Reservas</h2>
            <div id="reservasContainer">
                <p>Cargando reservas...</p>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Velvet Society</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">Velvet <span>Society</span></a>
        <ul class="navbar-nav">
            <li><a href="/">Inicio</a></li>
            <li><a href="/registro.html">Registrarse</a></li>
        </ul>
    </nav>

    <div class="container" style="max-width: 400px; margin-top: 4rem;">
        <div class="card">
            <h2 class="text-center">Iniciar Sesión</h2>
            <p class="text-center">Accede a tu cuenta Velvet Society</p>

            <div id="alerta" class="alert hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" class="form-control" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input type="password" id="contraseña" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
            </form>

            <p class="text-center mt-2">¿No tienes cuenta? <a href="/registro.html" style="color: var(--dorado);">Regístrate</a></p>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
